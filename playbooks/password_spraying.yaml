rule: password_spraying
title: Password spraying
group: Logs
summary: >-
  One IP tries a few common passwords against many different accounts. Each account sees only one or two
  failures, so lockout never triggers.
why_attackers: >-
  Users reuse passwords such as Summer2026! or Welcome1. Trying one password across hundreds of accounts
  finds the weak ones without locking anyone out.
base_signal: {lean: TP, text: "One source failing against {user_count} different usernames is a spraying pattern"}
five_ws:
  who: {ask: "Which IP, and which accounts were tried?", auto: "{source_ip} ({ip_type}) tried accounts: {users}"}
  what: {ask: "How many accounts, how many attempts, any success?", auto: "{count} failed logins across {user_count} usernames; also from this IP: {related_rules}"}
  when: {ask: "When, and how fast?", auto: "{date}, {start_time} for {duration}"}
  where: {ask: "Which login service (SSH, VPN, Outlook, Azure AD)?", auto: "{host}"}
  why: {ask: "Could it be legitimate? A shared jump host or a broken script cycling through accounts?", auto: ""}
  how: {ask: "Technique?", auto: "{mitre_id} {mitre_name}: few passwords, many accounts, to avoid lockout"}
true_positive_signs:
  - Many usernames from one external IP, including default or non-existent ones (admin, test, oracle)
  - Attempts spaced evenly, typical of a tool
  - Any account later logs in successfully from the same IP
false_positive_signs:
  - A shared internal jump host where many staff log in (check the times match real users)
  - A misconfigured application trying several service accounts
investigate:
  - List every targeted account and check each for a later successful login
  - Check the IP's reputation and whether it also probed other services
  - Ask identity / helpdesk whether a migration or script was running
verdict_guide:
  true_positive: An external IP trying many accounts, especially generic ones. Treat any later success as a compromise.
  false_positive: Traced to a known internal host or application with an explanation that matches the times.
  escalate: Any targeted account logged in successfully, or privileged accounts were in the list.
comment_template: >-
  Password-spraying alert. Who: {who}. What: {what}. When: {when}. Where: {where}. Why: {why}.
  How: {how}. Verdict: {verdict}. Next step: check every targeted account for later successful logins.
next_steps:
  - Block the source IP
  - Force password resets for targeted accounts and enforce MFA
  - Add banned-password lists (common seasonal passwords)
