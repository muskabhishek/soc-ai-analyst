rule: cleartext_credentials
title: Credentials sent in cleartext
group: Network
summary: >-
  A username and password crossed the network readably: FTP USER/PASS, HTTP Basic auth, or a login form
  posted over plain HTTP. Anyone on the path could capture them.
why_attackers: >-
  Sniffing cleartext protocols is one of the easiest ways to collect credentials once inside a network,
  or on public Wi-Fi.
base_signal: {lean: TP, text: "A password was readable on the wire; the exposure is real whatever the intent"}
five_ws:
  who: {ask: "Which client sent it, and whose account?", auto: "client {source_ip} ({ip_type}), account(s): {users}"}
  what: {ask: "Which protocol, which service?", auto: "{description}"}
  when: {ask: "When, and how often does this client do it?", auto: "{date} at {start_time}"}
  where: {ask: "Which server received it, internal or on the internet?", auto: "server {peer_ip} ({peer_type})"}
  why: {ask: "Is this an approved legacy system, or a user logging in somewhere they should not?", auto: ""}
  how: {ask: "Technique and evidence?", auto: "{mitre_id} {mitre_name}. Wireshark: {wireshark_filter}"}
true_positive_signs:
  - Credentials sent to an internet server
  - A corporate or privileged account
  - Several clients or accounts doing the same (a systemic exposure)
false_positive_signs:
  - Rarely a pure false positive. A lab or test system with dummy credentials can be closed as Benign True Positive.
investigate:
  - Identify the account and the service (Follow TCP Stream with the filter)
  - Check whether the account was used from another IP afterwards
  - Find the owner of the legacy service
verdict_guide:
  true_positive: A real account's password crossed the network readably; treat it as exposed.
  false_positive: Only test or dummy credentials on an isolated lab system.
  escalate: Privileged accounts, or any later login with the account from an unexpected source.
comment_template: >-
  Cleartext credentials. Who: {who}. What: {what}. When: {when}. Where: {where}. Why: {why}.
  How: {how}. Verdict: {verdict}. Next step: reset the exposed password and move the service to an encrypted protocol.
next_steps:
  - Reset the exposed password
  - Replace FTP / Telnet / HTTP Basic with SFTP / SSH / HTTPS
  - Check for use of the account from other sources
